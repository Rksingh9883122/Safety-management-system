{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
<section class="auth-panel">
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h2>Set a new password</h2>
    <p class="text-muted">Choose a new password for your HSE Management System account.</p>
    {% if error %}
        <p class="auth-alert" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('reset_password', token=token) }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="password_confirm">Confirm new password</label>
            <input type="password" id="password_confirm" name="password_confirm" minlength="12" maxlength="128" autocomplete="new-password" required>
        </div>
        <button type="submit">Reset Password</button>
    </form>
</section>
<style>
    .auth-panel { max-width: 540px; margin: 2rem auto; padding: 2rem; border: 1px solid #dfe7ef; border-radius: 12px; }
    .eyebrow { color: var(--do-teal); font-weight: 700; letter-spacing: .12em; font-size: .78rem; }
    .auth-alert { padding: 12px; color: #8a1c1c; background: #fee2e2; border-radius: 4px; }
</style>
{% endblock %}
