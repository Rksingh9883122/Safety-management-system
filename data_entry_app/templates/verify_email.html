{% extends "base.html" %}

{% block content %}
<section class="auth-panel">
    <p class="eyebrow">EMAIL VERIFICATION</p>
    <h2>Activate your administrator account</h2>
    <p>Confirm that you control the registration email address. This verification link is one-time use.</p>
    <form method="post" action="{{ url_for('verify_email', token=token) }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <button type="submit">Verify Email and Activate Workspace</button>
    </form>
</section>
<style>
    .auth-panel { max-width: 640px; margin: 2rem auto; padding: 2rem; border: 1px solid #dfe7ef; border-radius: 12px; }
    .eyebrow { color: var(--do-teal); font-weight: 700; letter-spacing: .12em; font-size: .78rem; }
</style>
{% endblock %}
